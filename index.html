<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Company Logo -->
    <img src="assets/it.jpg" alt="IT Logo" class="logo">
    <img src="assets/nap.png" alt="NAP Logo" class="logo">

    <div class="form-section">
      <h2>Create Your Email Signature</h2>
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe">
      
      <label>Job Title</label>
      <input type="text" id="title" placeholder="Software Engineer">
      
      <label>Department</label>
      <input type="text" id="department" placeholder="Technology">

      <label>Email</label>
      <input type="text" id="email" placeholder="john.doe@example.com">
      
      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="+1 555 555 5555">
      
      <button onclick="copySignature()">Copy Signature</button>
    </div>
    <div class="preview-section">
      <h2>Signature Preview</h2>
      <div id="signaturePreview" class="signature-preview">
        <!-- Signature content will be dynamically generated here -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
