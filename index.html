<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Company Logo -->
    <img src="assets/it.jpg" alt="IT Logo" class="logo">
    <img src="assets/nap.png" alt="NAP Logo" class="logo">

    <div class="form-section">
      <h2>Create Your Email Signature</h2>
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Name">
      
      <label>Job Title</label>
      <input type="text" id="title" placeholder="Magician">

      <label>Research Area</label>
      <input type="text" id="researcharea" placeholder="APU Flasher">
      
      <label>Department</label>
      <input type="text" id="department" placeholder="Outsider yew!">

      <label>Email</label>
      <input type="text" id="email" placeholder="your.email@av.it.pt">
      
      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="+351">
      
      <button onclick="copySignature()">Copy Signature</button>
    </div>
    <div class="preview-section">
      <h2>Signature Preview</h2>
      <div id="signaturePreview" class="signature-preview">
        <!-- Auto generate signature -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
